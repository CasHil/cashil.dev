StylesPath = styles
MinAlertLevel = suggestion
Vocab = Tropes

# Documentation: the tropes.fyi rules, same as the home repo.
[*.md]
BasedOnStyles = Tropes

# Site copy, extracted from src/i18n by scripts/lint-prose.mjs.
[.vale-copy/site.en.md]
BasedOnStyles = Tropes

# Dutch site copy: the CasperNL rules from the home repo (projects/slidev-brand/vale).
# Slide-only rules and the spoken-sentence limit do not apply to a web page.
[.vale-copy/site.nl.md]
BasedOnStyles = CasperNL
Tropes = NO
CasperNL.KopLengte = NO
CasperNL.LijstRegel = NO
CasperNL.StreepjeOpSlide = YES
CasperNL.LangeZin = NO

[*{.claude,node_modules,dist,build,styles}*]
Tropes = NO
