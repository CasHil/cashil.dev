extends: existence
message: 'Avoid narrow vocabulary echoes ''%s'' across paragraphs (Tropes: Self-echo).'
level: suggestion
link: https://tropes.fyi/tropes/self-echo
ignorecase: true
tokens:
- quietly become the real source of truth
- wearing the same italics
tests:
- name: flags self echo token
